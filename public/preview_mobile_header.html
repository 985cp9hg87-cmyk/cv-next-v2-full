<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Header Options</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b1321;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --brand2: #22d3ee;
            --stroke: rgba(14, 165, 233, .35);
            --shadow: 0 22px 60px rgba(0, 0, 0, .45);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .option-label {
            color: var(--brand2);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 40px 0 10px;
            border-bottom: 1px solid var(--stroke);
            padding-bottom: 5px;
        }

        /* Base Header Styles */
        .hero-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--stroke);
            padding: 20px;
            border-radius: 12px;
        }

        .avatar {
            background: linear-gradient(180deg, #0b1220, #0f1a2a);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            margin: 0;
            line-height: 1.1;
        }

        .subtitle {
            color: #E1C16E;
            font-weight: 700;
            display: block;
        }

        /* OPTION 1: CENTERED STACK (Symmetry) */
        .opt-1 {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .opt-1 .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            /* Circle for symmetry */
        }

        .opt-1 h1 {
            font-size: 32px;
        }

        .opt-1 h1 span {
            display: block;
        }

        .opt-1 .subtitle {
            font-size: 20px;
            margin-top: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* OPTION 2: BALANCED ROW (Refined Side-by-Side) */
        .opt-2 {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 20px;
            align-items: center;
            text-align: left;
        }

        .opt-2 .avatar {
            width: 110px;
            height: 110px;
            border-radius: 16px;
        }

        .opt-2 h1 {
            font-size: 28px;
        }

        .opt-2 h1 span {
            display: block;
        }

        .opt-2 .subtitle {
            font-size: 18px;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* OPTION 3: MODERN CARD (Integrated) */
        .opt-3 {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            padding-top: 60px;
            margin-top: 60px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent);
            border-radius: 20px;
            border: 1px solid var(--stroke);
        }

        .opt-3 .avatar {
            width: 120px;
            height: 120px;
            border-radius: 20px;
            position: absolute;
            top: -60px;
            border: 4px solid var(--bg);
            /* Cutout effect */
        }

        .opt-3 h1 {
            font-size: 30px;
            margin-top: 10px;
        }

        .opt-3 .subtitle {
            font-size: 16px;
            margin: 8px 0 20px;
            background: rgba(225, 193, 110, 0.1);
            color: #E1C16E;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="option-label">Opción 1: Simetría Total (Centrado)</div>
    <div class="hero-container opt-1">
        <figure class="avatar">
            <img src="assets/foto_final.jpg" alt="Profile">
        </figure>
        <div class="title">
            <h1><span>José Luis</span> <span>Acevedo Ayala</span></h1>
            <div class="subtitle">Ingeniero Comercial</div>
        </div>
    </div>

    <div class="option-label">Opción 2: Balanceado (Lado a Lado Ajustado)</div>
    <div class="hero-container opt-2">
        <figure class="avatar">
            <img src="assets/foto_final.jpg" alt="Profile">
        </figure>
        <div class="title">
            <h1><span>José Luis</span> <span>Acevedo Ayala</span></h1>
            <div class="subtitle">Ingeniero Comercial</div>
        </div>
    </div>

    <div class="option-label">Opción 3: Tarjeta Moderna (Foto Flotante)</div>
    <div class="hero-container opt-3">
        <figure class="avatar">
            <img src="assets/foto_final.jpg" alt="Profile">
        </figure>
        <div class="title">
            <h1><span>José Luis</span> <span>Acevedo Ayala</span></h1>
            <div class="subtitle">Ingeniero Comercial</div>
        </div>
    </div>

</body>

</html>
